# Generado por scripts/generar-panel.py — no editar a mano
backend:
  name: github
  repo: franaltt/piero-web
  branch: main
  commit_messages:
    update: 'Panel: actualiza {{slug}}'
local_backend: true
locale: es
logo_url: /admin/logo.svg
media_folder: public/uploads
public_folder: /uploads
collections:
- name: ventas
  label: Precios y ofertas
  editor:
    preview: false
  files:
  - name: oferta
    label: Oferta
    file: content/oferta.json
    format: json
    fields:
    - name: active
      label: Oferta prendida
      widget: boolean
      hint: Prendela para que aparezca en la web. Se apaga sola cuando pasa la fecha.
    - name: until
      label: Válida hasta (inclusive)
      widget: datetime
      format: YYYY-MM-DD
      date_format: DD/MM/YYYY
      time_format: false
    - name: applies_to
      label: Se aplica a
      widget: select
      options:
      - label: El piloto
        value: pilot
      - label: Plan base
        value: base
      - label: Plan estandar
        value: estandar
      - label: Plan completo
        value: completo
    - name: price
      label: Precio de oferta (USD)
      widget: number
      value_type: int
    - name: title
      label: Título
      widget: object
      fields:
      - name: es
        label: Español
        widget: string
      - name: it
        label: Italiano
        widget: string
        required: false
      - name: en
        label: Inglés
        widget: string
        required: false
    - name: text
      label: Texto ({price} = precio de oferta, {regular} = precio normal, {until} = fecha)
      widget: object
      fields:
      - name: es
        label: Español
        widget: text
      - name: it
        label: Italiano
        widget: text
        required: false
      - name: en
        label: Inglés
        widget: text
        required: false
    - name: cta
      label: Texto del botón
      widget: object
      fields:
      - name: es
        label: Español
        widget: string
      - name: it
        label: Italiano
        widget: string
        required: false
      - name: en
        label: Inglés
        widget: string
        required: false
  - name: precios
    label: Precios
    file: content/precios.json
    format: json
    fields:
    - name: pilot
      label: El piloto
      widget: object
      fields:
      - name: price
        label: Precio (USD)
        widget: number
        value_type: int
      - name: pieces
        label: Piezas
        widget: number
        value_type: int
      - name: weeks
        label: Semanas
        widget: number
        value_type: int
    - name: plans
      label: Planes mensuales
      widget: list
      summary: '{{fields.id}} · USD {{fields.price}}'
      fields:
      - name: id
        label: Código del plan (no cambiar)
        widget: string
        hint: base, estandar o completo. El nombre visible se cambia en Textos → Precios.
      - name: perWeek
        label: Piezas por semana
        widget: number
        value_type: int
      - name: price
        label: Precio por mes (USD)
        widget: number
        value_type: int
      - name: channels
        label: Redes incluidas
        widget: select
        multiple: true
        options:
        - label: Instagram
          value: instagram
        - label: Facebook
          value: facebook
        - label: TikTok
          value: tiktok
        - label: YouTube Shorts
          value: youtube
        - label: LinkedIn
          value: linkedin
      - name: changes
        label: Cambios en hasta (horas)
        widget: number
        value_type: int
      - name: publish
        label: Publicación incluida
        widget: boolean
        required: false
      - name: recommended
        label: Es el que recomiendo
        widget: boolean
        required: false
      - name: priority
        label: Cambios con prioridad
        widget: boolean
        required: false
- name: datos
  label: Números, contacto y trabajos
  editor:
    preview: false
  files:
  - name: numeros
    label: Números y contacto
    file: content/numeros.json
    format: json
    fields:
    - name: clients
      label: Clientes (+)
      widget: number
      value_type: int
    - name: pieces
      label: Piezas hechas (+)
      widget: number
      value_type: int
    - name: years
      label: Años creando contenido
      widget: number
      value_type: int
    - name: clients_brands
      label: Marcas de la cinta
      widget: list
      field:
        name: marca
        label: Marca
        widget: string
    - name: socials
      label: Redes
      widget: list
      summary: '{{fields.name}}'
      fields:
      - name: name
        label: Red
        widget: string
      - name: handle
        label: Usuario
        widget: string
      - name: url
        label: Link
        widget: string
    - name: whatsapp
      label: WhatsApp
      widget: object
      fields:
      - name: number
        label: Número (solo dígitos, con código de país)
        widget: string
      - name: display
        label: Cómo se muestra
        widget: string
  - name: trabajos
    label: Trabajos del carrusel
    file: content/trabajos.json
    format: json
    fields:
    - name: items
      label: Piezas
      widget: list
      summary: '{{fields.brand}} · {{fields.type}}'
      fields:
      - name: type
        label: Tipo
        widget: select
        options:
        - label: Anuncio (imagen)
          value: anuncio
        - label: Video
          value: video
        - label: Video casero (con sonido)
          value: casero
      - name: brand
        label: Marca
        widget: string
      - name: rubro
        label: Rubro
        widget: select
        options:
        - agriturismo
        - cosmetica
        - deporte
        - panaderia
        - cocina
        - cine
        - sangucheria
        - bebidas
        - automotor
        - musica
        - moda
        - inmobiliaria
        - barberia
        - producto
      - name: src
        label: Archivo (imagen o video .mp4)
        widget: file
      - name: poster
        label: Portada del video (opcional)
        widget: image
        required: false
      - name: secs
        label: Duración en segundos (videos caseros)
        widget: number
        value_type: int
        required: false
- name: recursos
  label: Recursos gratis
  editor:
    preview: false
  files:
  - name: recursos
    label: Guías, skill y Mailchimp
    file: content/recursos.json
    format: json
    fields:
    - name: mailchimp
      label: Mailchimp
      widget: object
      fields:
      - name: url
        label: Dirección del formulario
        widget: string
        required: false
        hint: 'En Mailchimp: Audience → Signup forms → Embedded forms. Copiá lo que va en action="…" (termina en /subscribe/post?u=…&id=…).'
      - name: guide_field
        label: Campo para saber qué guía pidió (opcional)
        widget: string
        required: false
        hint: Si creás un campo en tu audiencia (por ejemplo GUIA), escribí su etiqueta acá.
    - name: skill
      label: Skill destacada
      widget: object
      fields:
      - name: active
        label: Mostrar
        widget: boolean
      - name: name
        label: Nombre
        widget: string
      - name: price
        label: Precio (USD)
        widget: number
        value_type: int
      - name: buy_url
        label: Link de compra
        widget: string
        required: false
        hint: Si lo dejás vacío, el botón abre WhatsApp.
      - name: video
        label: Video
        widget: file
      - name: desc
        label: Descripción
        widget: object
        fields:
        - name: es
          label: Español
          widget: text
        - name: it
          label: Italiano
          widget: text
          required: false
        - name: en
          label: Inglés
          widget: text
          required: false
      - name: bullets
        label: Puntos
        widget: object
        fields:
        - name: es
          label: Español
          widget: list
          field:
            name: punto
            label: Punto
            widget: string
        - name: it
          label: Italiano
          widget: list
          field:
            name: punto
            label: Punto
            widget: string
        - name: en
          label: Inglés
          widget: list
          field:
            name: punto
            label: Punto
            widget: string
    - name: guides
      label: Guías
      widget: list
      summary: '{{fields.slug}}'
      fields:
      - name: slug
        label: Código (sin espacios)
        widget: string
      - name: kind
        label: Tipo
        widget: select
        options:
        - label: Guía
          value: guia
        - label: Prompt
          value: prompt
      - name: pages
        label: Páginas
        widget: number
        value_type: int
      - name: cover
        label: Portada
        widget: image
        required: false
      - name: mailchimp_tag
        label: ID de etiqueta de Mailchimp (opcional)
        widget: string
        required: false
        hint: Con una etiqueta por guía, en Mailchimp armás un envío automático que manda el PDF correcto.
      - name: title
        label: Título
        widget: object
        fields:
        - name: es
          label: Español
          widget: string
        - name: it
          label: Italiano
          widget: string
          required: false
        - name: en
          label: Inglés
          widget: string
          required: false
      - name: desc
        label: Descripción
        widget: object
        fields:
        - name: es
          label: Español
          widget: text
        - name: it
          label: Italiano
          widget: text
          required: false
        - name: en
          label: Inglés
          widget: text
          required: false
