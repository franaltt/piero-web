[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# el panel no se indexa en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# /recursos sin barra final también funciona
[[redirects]]
  from = "/recursos"
  to = "/recursos/"
  status = 301
